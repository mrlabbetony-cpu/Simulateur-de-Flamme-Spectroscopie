<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulateur de Flamme & Spectroscopie</title>
    <style>
        body {
            margin: 0;
            background-color: #0d0d0d;
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 5px;
            text-align: center;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.2em;
        }

        .sub-title {
            font-size: 0.85em;
            color: #aaa;
            text-align: center;
            margin-bottom: 20px;
        }

        #canvas-container {
            position: relative;
            width: 350px;
            height: 400px;
            background: radial-gradient(circle at 50% 80%, #1a1a1a 0%, #000 100%);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 0 20px #000;
            overflow: hidden;
            border: 1px solid #333;
            margin-bottom: 15px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .controls {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border: 1px solid #333;
            box-sizing: border-box;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #ddd;
            font-size: 0.9em;
        }

        input[type=range] {
            width: 100%;
            cursor: pointer;
            accent-color: #ff5e00;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #0d0d0d;
            padding: 10px;
            border-radius: 8px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            font-weight: 400;
            margin: 0;
            cursor: pointer;
            color: #bbb;
            font-size: 0.85em;
        }

        .radio-group input {
            margin-right: 8px;
            accent-color: #00d2ff;
        }

        #status {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #333;
            font-style: italic;
            color: #ff9d00;
            text-align: center;
            font-size: 0.85em;
        }
        
        .temp-display {
            color: #ff5e00;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Simulateur de Flamme</h2>
    <div class="sub-title">Explorez la thermique de combustion et l'émission spectrale.</div>
    
    <div id="canvas-container">
        <canvas id="flameCanvas" width="350" height="400"></canvas>
    </div>

    <div class="controls">
        <div class="control-group">
            <label for="tempSlider">Température: <span id="tempValue" class="temp-display">1000</span> °C</label>
            <input type="range" id="tempSlider" min="500" max="2000" value="1000" step="10">
        </div>

        <div class="control-group">
            <label>Additifs chimiques (Test de flamme)</label>
            <div class="radio-group">
                <label><input type="radio" name="chemical" value="none" checked> Aucun</label>
                <label><input type="radio" name="chemical" value="cu"> Cuivre (Cu²⁺)</label>
                <label><input type="radio" name="chemical" value="sr"> Strontium (Sr²⁺)</label>
                <label><input type="radio" name="chemical" value="na"> Sodium (Na⁺)</label>
                <label><input type="radio" name="chemical" value="k"> Potassium (K⁺)</label>
            </div>
        </div>

        <div id="status">Flamme thermique (1000°C) — Jaune vif. Combustion complète standard.</div>
    </div>

    <script>
        const canvas = document.getElementById('flameCanvas');
        const ctx = canvas.getContext('2d');
        const tempSlider = document.getElementById('tempSlider');
        const tempValue = document.getElementById('tempValue');
        const statusText = document.getElementById('status');
        const radios = document.querySelectorAll('input[name="chemical"]');

        let particles = [];
        let currentTemp = 1000;
        let currentChem = 'none';
        
        function updateSliderColor() {
            let color = '#ff5e00';
            if (currentChem === 'none') {
                if (currentTemp < 800) color = '#ff2a00';
                else if (currentTemp > 1400) color = '#00aeff';
            } else {
                if (currentChem === 'cu') color = '#00ffaa';
                if (currentChem === 'sr') color = '#ff003c';
                if (currentChem === 'na') color = '#ffcc00';
                if (currentChem === 'k') color = '#d400ff';
            }
            tempSlider.style.accentColor = color;
            tempValue.style.color = color;
        }

        function updateStatus() {
            tempValue.textContent = currentTemp;
            
            if (currentChem !== 'none') {
                const chemNames = { 
                    cu: `Flamme thermique (${currentTemp}°C) — Vert émeraude (Cuivre)`, 
                    sr: `Flamme thermique (${currentTemp}°C) — Rouge sang (Strontium)`, 
                    na: `Flamme thermique (${currentTemp}°C) — Jaune vif (Sodium)`, 
                    k: `Flamme thermique (${currentTemp}°C) — Lilas/Violet (Potassium)` 
                };
                statusText.textContent = chemNames[currentChem];
            } else {
                if (currentTemp < 800) {
                    statusText.textContent = `Flamme thermique (${currentTemp}°C) — Rouge sombre. Combustion incomplète, suie.`;
                } else if (currentTemp < 1400) {
                    statusText.textContent = `Flamme thermique (${currentTemp}°C) — Jaune vif. Combustion complète standard.`;
                } else {
                    statusText.textContent = `Flamme thermique (${currentTemp}°C) — Bleu/Blanc. Combustion vive, oxygénée.`;
                }
            }
            updateSliderColor();
        }

        tempSlider.addEventListener('input', (e) => {
            currentTemp = parseInt(e.target.value);
            updateStatus();
        });

        radios.forEach(r => r.addEventListener('change', (e) => {
            if(e.target.checked) currentChem = e.target.value;
            updateStatus();
        }));

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = canvas.width / 2 + (Math.random() - 0.5) * 40;
                this.y = canvas.height;
                this.vx = (Math.random() - 0.5) * 1.2;
                let speedBoost = (currentTemp - 500) / 1500; 
                this.vy = -(Math.random() * 3 + 2 + speedBoost * 2);
                this.life = 1.0;
                this.decay = Math.random() * 0.015 + 0.01;
                this.size = Math.random() * 18 + 12;
            }

            update() {
                this.x += this.vx + Math.sin(this.life * 15) * 0.6;
                this.y += this.vy;
                this.life -= this.decay;
                this.size *= 0.98;

                if (this.life <= 0 || this.size <= 0.5) this.reset();
            }

            draw(ctx) {
                let r, g, b;

                if (currentChem === 'none') {
                    if (currentTemp < 800) { r = 255; g = 30; b = 0; }
                    else if (currentTemp < 1200) { r = 255; g = 100; b = 0; }
                    else if (currentTemp < 1500) { r = 255; g = 200; b = 50; }
                    else { r = 0; g = 150; b = 255; }
                } else {
                    if (currentChem === 'cu') { r = 0; g = 255; b = 150; }
                    else if (currentChem === 'sr') { r = 255; g = 10; b = 20; }
                    else if (currentChem === 'na') { r = 255; g = 220; b = 0; }
                    else if (currentChem === 'k') { r = 200; g = 80; b = 255; }
                }

                ctx.globalCompositeOperation = 'lighter';
                
                let gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${this.life})`);
                gradient.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, ${this.life * 0.5})`);
                gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for(let i=0; i<100; i++) particles.push(new Particle());

        function animate() {
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(p => {
                p.update();
                p.draw(ctx);
            });
            
            requestAnimationFrame(animate);
        }

        animate();
        updateStatus();
    </script>
</body>
</html>
